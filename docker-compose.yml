services:
  homepage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homepage
    # 只将 homepage 端口绑定到宿主机回环地址，由 Tengine 转发对外提供服务。
    ports:
      - "127.0.0.1:${NITRO_PORT:?NITRO_PORT must be set in .env}:${NITRO_PORT:?NITRO_PORT must be set in .env}"
    env_file:
      - .env
    environment:
      # 容器内部需要监听所有容器网卡，宿主机暴露范围由 ports 的 127.0.0.1 约束。
      NITRO_HOST: 0.0.0.0
    restart: unless-stopped
